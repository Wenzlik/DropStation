# XcodeGen project specification.
# Run `xcodegen generate` to (re)create DropStation.xcodeproj from this file.
# Install with: `brew install xcodegen`
name: DropStation
options:
  bundleIdPrefix: com.wenzlik
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "8"

targets:
  DropStation:
    type: application
    platform: iOS
    sources:
      - path: DropStation
        excludes:
          - "Resources/Info.plist"
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStation
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DropStation/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DropStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DropStationTests
    dependencies:
      - target: DropStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStationTests
        GENERATE_INFOPLIST_FILE: "YES"
