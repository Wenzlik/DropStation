# XcodeGen project specification.
# Run `xcodegen generate` to (re)create DropStation.xcodeproj from this file.
# Install with: `brew install xcodegen`
name: DropStation
options:
  bundleIdPrefix: com.wenzlik
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    # Bump MARKETING_VERSION when the user-visible version changes
    # (CHANGELOG / Settings → What's new). Bump CURRENT_PROJECT_VERSION
    # on every archive intended for TestFlight upload — App Store
    # Connect rejects duplicate (MARKETING_VERSION, CURRENT_PROJECT_VERSION)
    # pairs.
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "14"

targets:
  DropStation:
    type: application
    platform: iOS
    sources:
      - path: DropStation
        excludes:
          - "Resources/Info.plist"
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStation
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DropStation/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing config — required for any archive intended for
        # TestFlight or the App Store. Uncomment both lines and paste
        # your 10-character Apple Developer team id (Membership page
        # in the Apple developer portal). With Automatic style, Xcode
        # auto-creates and manages the distribution provisioning
        # profile for `com.wenzlik.DropStation`.
        #
        # Local-only development builds (⌘R against a tethered
        # device) work without these lines — Xcode falls back to
        # "Sign to run locally" with your personal team. The lines
        # only matter when you archive.
        #
        # CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX

  DropStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DropStationTests
    dependencies:
      - target: DropStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStationTests
        GENERATE_INFOPLIST_FILE: "YES"
