# XcodeGen project specification.
# Run `xcodegen generate` to (re)create SynoGet.xcodeproj from this file.
# Install with: `brew install xcodegen`
name: SynoGet
options:
  bundleIdPrefix: com.wenzlik
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.2.3"
    CURRENT_PROJECT_VERSION: "5"

targets:
  SynoGet:
    type: application
    platform: iOS
    sources:
      - path: SynoGet
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.SynoGet
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SynoGet/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SynoGetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SynoGetTests
    dependencies:
      - target: SynoGet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.SynoGetTests
        GENERATE_INFOPLIST_FILE: "YES"
