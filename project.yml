# XcodeGen project specification.
# Run `xcodegen generate` to (re)create DropStation.xcodeproj from this file.
# Install with: `brew install xcodegen`
name: DropStation
options:
  bundleIdPrefix: com.wenzlik
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    # Bump MARKETING_VERSION when the user-visible version changes
    # (CHANGELOG / Settings → What's new). Bump CURRENT_PROJECT_VERSION
    # on every archive intended for TestFlight upload — App Store
    # Connect rejects duplicate (MARKETING_VERSION, CURRENT_PROJECT_VERSION)
    # pairs.
    MARKETING_VERSION: "0.5.5"
    CURRENT_PROJECT_VERSION: "16"

targets:
  DropStation:
    type: application
    platform: iOS
    sources:
      - path: DropStation
        excludes:
          - "Resources/Info.plist"
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStation
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DropStation/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Single clean blue accent — the one UI accent across the app
        # (CTAs, links, selection, the Downloading status). Owned via
        # the AccentColor colorset rather than the implicit system blue
        # so the exact shade is ours.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signing config — required for any archive intended for
        # TestFlight or the App Store. Uncomment both lines and paste
        # your 10-character Apple Developer team id (Membership page
        # in the Apple developer portal). With Automatic style, Xcode
        # auto-creates and manages the distribution provisioning
        # profile for `com.wenzlik.DropStation`.
        #
        # Local-only development builds (⌘R against a tethered
        # device) work without these lines — Xcode falls back to
        # "Sign to run locally" with your personal team. The lines
        # only matter when you archive.
        #
        # CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX
    dependencies:
      # Embed the Live Activity / widget extension into the app bundle.
      - target: DropStationWidgets
        embed: true

  # WidgetKit extension — hosts the downloads Live Activity (Dynamic
  # Island + lock screen). Shares DownloadsActivityAttributes.swift
  # with the app so the contract can't drift.
  DropStationWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DropStationWidgets
        excludes:
          - "Info.plist"
      - path: DropStation/Shared/DownloadsActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStation.Widgets
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DropStationWidgets/Info.plist
        SWIFT_EMIT_LOC_STRINGS: "YES"

  DropStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DropStationTests
    dependencies:
      - target: DropStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wenzlik.DropStationTests
        GENERATE_INFOPLIST_FILE: "YES"
